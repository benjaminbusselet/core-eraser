# Vérification automatique à chaque envoi : shellcheck puis tests, sur une machine macOS de GitHub
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Shellcheck
        run: shellcheck -s bash core-eraser.sh tests/run-tests.sh
      - name: Tests
        run: tests/run-tests.sh
